name: drupal

services:
  drupal:
    image: drupal:10-apache
    ports:
      - "127.0.0.1:8084:80"
    volumes:
      - drupal-data-modules:/var/www/html/modules
      - drupal-data-profiles:/var/www/html/profiles
      - drupal-data-themes:/var/www/html/themes
      - drupal-data-sites:/var/www/html/sites
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: drupal
      POSTGRES_DB: drupal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definis POSTGRES_PASSWORD dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drupal -d drupal"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  drupal-data-modules:
  drupal-data-profiles:
  drupal-data-themes:
  drupal-data-sites: